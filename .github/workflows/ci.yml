name: Django CI/CD Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
        - name: Check out code
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.13'

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install flake8

        - name: Run Flake8
          run: flake8 --exclude=users/migrations .

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
        - name: Check out code
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.13'

        - name: Install Poetry
          run: |
            curl -sSL https://install.python-poetry.org | python3 -
            echo "$HOME/.local/bin" >> $GITHUB_PATH

        - name: Install dependencies
          run: |
            poetry config virtualenvs.create false
            poetry install --no-interaction --no-root

        - name: Create test settings
          run: |
            cat > test_settings.py << 'EOF'
            from config.settings import *

            SECRET_KEY = 'test-secret-key-for-ci'
            DEBUG = True
            
            class DisableMigrations:
              def __contains__(self, item):
                return True
              def __getitem__(self, item):
                return None

            MIGRATION_MODULES = DisableMigrations()
            EOF

        - name: Run tests with custom settings
          run: poetry run python manage.py test --settings=test_settings

  docker-build-test:
    needs: test
    runs-on: ubuntu-latest

    env:
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh

      - name: Install Docker Compose plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
          
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Verify Docker Compose installation
        run: |
          docker --version
          docker compose version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Validate docker-compose.yaml
        run: docker-compose -f docker-compose.yaml --env-file /dev/null config

      - name: Build Docker images
        run: docker-compose -f docker-compose.yaml --env-file /dev/null build

  build:
    needs: docker-build-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    - name: Deploy to Server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} \
            "docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} && \
             docker stop myapp 2>/dev/null || true && \
             docker rm myapp 2>/dev/null || true && \
             docker run -d --name myapp -p 80:8000 \
               -e DATABASE_URL='${{ secrets.PROD_DATABASE_URL }}' \
               -e DJANGO_SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY }}' \
               -e DJANGO_DEBUG='${{ secrets.DJANGO_DEBUG }}' \
               ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} && \
             docker image prune -f"
